<script>
'use strict';

const TOPIC='bandsync-3895bb890a4eb15dcaa9';
const NTFY='https://ntfy.sh/'+TOPIC;
const DEVICE_KEY='bs3_device';
const LAST_STATE_KEY='bs3_last_state';
const LAST_ALERT_KEY='bs3_last_alert';
const AWAKE_KEY='bs3_awake';
const DEVICE_NAME_KEY='bs3_device_name';
const NOTES_KEY='bs3_master_notes_v1';

const $=id=>document.getElementById(id);

let deviceId=localStorage.getItem(DEVICE_KEY)||'';
if(!deviceId){
  deviceId='d_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
  localStorage.setItem(DEVICE_KEY,deviceId);
}

let lastStateUpdated=0;
let currentVoteId='';
let votes={};
let alertTimer=null;
let wakeLock=null;
let awakeWanted=localStorage.getItem(AWAKE_KEY)==='1';
let presenceInterval=null;
let eventSource=null;
let lastReactionSentAt=0;
let lastVoteSentAt=0;
let masterNotes=[];
let lastStateReceivedAt=0;
let syncWatchTimer=null;
let syncPollTimer=null;
let syncPollBusy=false;
let lastTransportStatus='';
let deviceName=(localStorage.getItem(DEVICE_NAME_KEY)||'').trim();


function setTransportStatus(text){
  lastTransportStatus=text||'';
  const live=document.querySelector('.live');
  if(live){
    live.title=lastTransportStatus;
  }
}

function processEnvelopeObject(env){
  if(!env || env.event!=='message') return;

  let d=null;
  try{
    d=typeof env.message==='string' ? JSON.parse(env.message) : env.message;
  }catch{
    return;
  }

  if(!d || typeof d!=='object') return;

  const isQuickNote =
    d.type==='note' ||
    d.channel==='quick-note' ||
    String(d.id||'').startsWith('note_');

  if(isQuickNote){
    receiveMasterNote(d);
    return;
  }

  if(d.type==='alert'){
    showFreshAlert(d);
    return;
  }

  if(d.type==='vote'){
    if(d.voteId===currentVoteId && d.deviceId && (d.value==='yes'||d.value==='no')){
      votes[d.deviceId]=d.value;
      renderVotes();
    }
    return;
  }

  if(d.type==='state' || d.source==='master' || d.current!==undefined || d.next!==undefined){
    applyState(d,true);
  }
}

function applyState(d,persist=true){
  const updated=Number(d.updated)||0;
  const age=updated ? Date.now()-updated : Infinity;

  // Accept the latest valid state even after a longer pause; timestamp ordering prevents rollback.
  if(updated && age>86400000) return;
  if(updated && updated<lastStateUpdated) return;
  if(updated) lastStateUpdated=updated;
  lastStateReceivedAt=Date.now();

  $('current').textContent=d.current||'ČEKAM MASTER';
  $('next').textContent=d.next||'—';

  const incomingVote=d.voteId||'';
  if(incomingVote!==currentVoteId){
    currentVoteId=incomingVote;
    votes={};
  }
  renderVotes();

  if(persist){
    try{localStorage.setItem(LAST_STATE_KEY,JSON.stringify(d))}catch{}
  }
}

function voteCounts(){
  let yes=0,no=0;
  Object.values(votes).forEach(v=>{ if(v==='yes') yes++; else if(v==='no') no++; });
  return {yes,no,total:yes+no};
}

function renderVotes(){
  const panel=$('votePanel');
  if(!currentVoteId || $('next').textContent==='—'){
    panel.classList.add('hidden');
    return;
  }

  panel.classList.remove('hidden');
  const c=voteCounts();
  $('yesCount').textContent=c.yes;
  $('noCount').textContent=c.no;
  $('voteKnob').style.left=(c.total?c.yes/c.total*100:50)+'%';

  const mine=votes[deviceId]||'';
  $('voteYesBtn').classList.toggle('selected',mine==='yes');
  $('voteNoBtn').classList.toggle('selected',mine==='no');
  $('voteMine').textContent=mine==='yes'?'Tvoj glas: ZA':mine==='no'?'Tvoj glas: PROTIV':'Nisi glasao';
}

async function sendReaction(emoji,buttonEl=null){
  if(!emoji) return;

  const now=Date.now();
  if(now-lastReactionSentAt<500) return;
  lastReactionSentAt=now;

  try{
    await fetch(NTFY,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify({
        type:'reaction',
        emoji,
        deviceId,
        deviceName:currentDeviceName(),
        label:currentDeviceName(),
        updated:Date.now()
      }),
      cache:'no-store'
    });

    if(buttonEl){
      buttonEl.classList.add('sent');
      setTimeout(()=>buttonEl.classList.remove('sent'),450);
    }
  }catch(e){
    console.error(e);
  }
}

document.querySelectorAll('.reactionBtn').forEach(btn=>{
  btn.onclick=()=>{
    sendReaction(btn.dataset.emoji,btn);
    if(navigator.vibrate) navigator.vibrate(18);
  };
});

async function sendVote(value){
  if(!currentVoteId || (value!=='yes'&&value!=='no')) return;
  const now=Date.now();
  if(now-lastVoteSentAt<350) return;
  lastVoteSentAt=now;
  votes[deviceId]=value;
  renderVotes();
  try{
    await fetch(NTFY,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify({type:'vote',voteId:currentVoteId,deviceId,value,updated:Date.now()}),
      cache:'no-store'
    });
  }catch(e){ console.error(e); }
}

$('voteYesBtn').onclick=()=>sendVote('yes');
$('voteNoBtn').onclick=()=>sendVote('no');

function clearStaleAlertOverlay(){
  const overlay=$('alertOverlay');
  if(overlay) overlay.classList.remove('show');
  if(alertTimer){
    clearTimeout(alertTimer);
    alertTimer=null;
  }
}

function dismissAlert(){
  if(alertTimer) clearTimeout(alertTimer);
  alertTimer=null;
  $('alertOverlay').classList.remove('show');
}

function showFreshAlert(d){
  // Hard guard: Quick Notes must NEVER become fullscreen alerts,
  // including legacy/cached payloads that may still say type:'alert'.
  const legacyNote =
    d && (
      d.type==='note' ||
      d.channel==='quick-note' ||
      String(d.id||'').startsWith('note_')
    );
  if(legacyNote){
    receiveMasterNote(d);
    return;
  }

  const now=Date.now();
  const updated=Number(d.updated)||0;
  const age=updated?now-updated:Infinity;
  const id=String(d.id||updated||'');

  if(!id || !String(d.message||'').trim() || age<0 || age>15000) return;
  if(localStorage.getItem(LAST_ALERT_KEY)===id) return;

  localStorage.setItem(LAST_ALERT_KEY,id);
  $('alertText').textContent=d.message||'';
  $('alertOverlay').classList.add('show');

  if(alertTimer) clearTimeout(alertTimer);
  alertTimer=setTimeout(dismissAlert,Math.max(1800,Math.min(Number(d.duration)||6000,12000)));
}

$('alertClose').onclick=dismissAlert;
$('alertOverlay').onclick=ev=>{
  if(ev.target===$('alertOverlay')) dismissAlert();
};

async function acquireWakeLock(){
  if(!('wakeLock' in navigator)){
    $('awakeSub').textContent='Not supported in this browser';
    return false;
  }
  try{
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',()=>{
      wakeLock=null;
      
updateAwakeUI();
    });
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}

async function setAwakeWanted(on){
  awakeWanted=!!on;
  localStorage.setItem(AWAKE_KEY,awakeWanted?'1':'0');
  if(awakeWanted){
    await acquireWakeLock();
  }else if(wakeLock){
    try{ await wakeLock.release(); }catch{}
    wakeLock=null;
  }
  updateAwakeUI();
}

function updateAwakeUI(){
  $('awakeBox').textContent=(awakeWanted&&wakeLock)?'✓':'';
  $('awakeSub').textContent=awakeWanted?(wakeLock?'Screen will stay awake':'Waiting for browser permission'):'Tap to enable';
}

$('awakeBtn').onclick=()=>setAwakeWanted(!awakeWanted);

document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'){
    sendPresence();
    ensureConnection();

    if(awakeWanted && !wakeLock){
      await acquireWakeLock();
      updateAwakeUI();
    }
  }
});



function loadMasterNotes(){
  try{
    const parsed=JSON.parse(localStorage.getItem(NOTES_KEY)||'[]');
    masterNotes=Array.isArray(parsed)?parsed:[];
  }catch{
    masterNotes=[];
  }

  // Keep history bounded.
  if(masterNotes.length>100){
    masterNotes=masterNotes.slice(-100);
  }

  renderMasterNotes(false);
}

function saveMasterNotes(){
  try{
    localStorage.setItem(NOTES_KEY,JSON.stringify(masterNotes.slice(-100)));
  }catch{}
}

function formatNoteTime(ts){
  const d=new Date(Number(ts)||Date.now());
  return d.toLocaleTimeString([],{
    hour:'2-digit',
    minute:'2-digit'
  });
}

function renderMasterNotes(scrollToLatest=true){
  const box=$('masterNotesViewport');
  if(!box) return;

  box.innerHTML='';

  if(!masterNotes.length){
    const empty=document.createElement('div');
    empty.className='masterNotesEmpty';
    empty.textContent='Još nema poruka od Master-a.';
    box.appendChild(empty);
    return;
  }

  masterNotes.forEach((note,index)=>{
    const item=document.createElement('div');
    item.className='masterNoteItem'+(index===masterNotes.length-1?' newest':'');

    const time=document.createElement('div');
    time.className='masterNoteTime';
    time.textContent=formatNoteTime(note.updated);

    const body=document.createElement('div');
    body.className='masterNoteBody';

    const author=document.createElement('div');
    author.className='masterNoteAuthor';
    author.textContent='Marko (Master)';

    const text=document.createElement('div');
    text.className='masterNoteText';
    text.textContent=note.message||'';

    body.append(author,text);
    item.append(time,body);
    box.appendChild(item);
  });

  if(scrollToLatest){
    requestAnimationFrame(()=>{
      box.scrollTop=box.scrollHeight;
    });
  }
}

function receiveMasterNote(d){
  if(!d || !String(d.message||'').trim()) return;

  const updated=Number(d.updated)||Date.now();
  const age=Date.now()-updated;

  // Ignore replayed/stale notes older than 6 hours from ntfy history.
  if(age<0 || age>21600000) return;

  const id=String(d.id||('note_'+updated+'_'+String(d.message).slice(0,20)));
  if(masterNotes.some(n=>n.id===id)) return;

  masterNotes.push({
    id,
    message:String(d.message).trim(),
    updated
  });

  if(masterNotes.length>100){
    masterNotes=masterNotes.slice(-100);
  }

  saveMasterNotes();
  renderMasterNotes(true);
}

function currentDeviceName(){
  return (deviceName||'DISPLAY').trim()||'DISPLAY';
}

function updateDeviceNameUI(){
  $('deviceNameLabel').textContent=currentDeviceName();
}

async function sendPresence(){
  try{
    await fetch(NTFY,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify({
        type:'presence',
        deviceId,
        name:currentDeviceName(),
        updated:Date.now()
      }),
      cache:'no-store'
    });
  }catch(e){}
}

function openDeviceNameEditor(firstRun=false){
  $('deviceNameInput').value=deviceName||'';
  $('nameOverlay').classList.add('open');
  setTimeout(()=>$('deviceNameInput').focus(),80);
}

function saveDeviceName(){
  const value=$('deviceNameInput').value.replace(/\s+/g,' ').trim().toUpperCase();
  deviceName=value||'DISPLAY';
  localStorage.setItem(DEVICE_NAME_KEY,deviceName);
  $('nameOverlay').classList.remove('open');
  document.addEventListener('gesturestart',ev=>ev.preventDefault(),{passive:false});
document.addEventListener('gesturechange',ev=>ev.preventDefault(),{passive:false});
document.addEventListener('gestureend',ev=>ev.preventDefault(),{passive:false});

updateDeviceNameUI();
  sendPresence();
}


$('deviceNameBtn').onclick=()=>openDeviceNameEditor(false);
$('nameOverlay').onclick=ev=>{
  if(ev.target===$('nameOverlay') && localStorage.getItem(DEVICE_NAME_KEY)){
    $('nameOverlay').classList.remove('open');
  }
};
$('nameSave').onclick=saveDeviceName;

$('nameSkip').onclick=()=>{
  if(!deviceName){
    deviceName='DISPLAY';
    localStorage.setItem(DEVICE_NAME_KEY,deviceName);
  }
  $('nameOverlay').classList.remove('open');
  updateDeviceNameUI();
  sendPresence();
};

$('deviceNameInput').addEventListener('keydown',ev=>{
  if(ev.key==='Enter') saveDeviceName();
});



async function pollLatestState(){
  if(syncPollBusy || document.visibilityState!=='visible' || !navigator.onLine) return;
  syncPollBusy=true;

  try{
    const r=await fetch(
      NTFY+'/json?poll=1&since=30s&_='+Date.now(),
      {cache:'no-store'}
    );

    if(!r.ok) throw new Error('HTTP '+r.status);

    const text=await r.text();
    const lines=text.split(/\r?\n/).filter(Boolean);

    for(const line of lines){
      try{
        const env=JSON.parse(line);
        processEnvelopeObject(env);
      }catch{}
    }

    setTransportStatus(
      eventSource && eventSource.readyState===EventSource.OPEN
        ? 'LIVE SSE connected'
        : 'Fallback sync connected'
    );
  }catch(e){
    setTransportStatus('Waiting for sync…');
  }finally{
    syncPollBusy=false;
  }
}

function startFallbackSync(){
  if(syncPollTimer) clearInterval(syncPollTimer);

  pollLatestState();
  syncPollTimer=setInterval(()=>{
    const silentFor=lastStateReceivedAt ? Date.now()-lastStateReceivedAt : Infinity;

    // Poll continuously but especially useful when SSE misses messages.
    if(silentFor>5000 || !eventSource || eventSource.readyState!==EventSource.OPEN){
      pollLatestState();
    }
  },3000);
}

function startSyncWatchdog(){
  if(syncWatchTimer) clearInterval(syncWatchTimer);
  syncWatchTimer=setInterval(()=>{
    if(document.visibilityState!=='visible') return;

    const silentFor=lastStateReceivedAt ? Date.now()-lastStateReceivedAt : Infinity;

    if(silentFor>15000){
      pollLatestState();
    }

    if(silentFor>30000){
      if(eventSource){
        try{eventSource.close()}catch{}
        eventSource=null;
      }
      connect();
    }
  },10000);
}

function ensureConnection(){
  if(!eventSource || eventSource.readyState===EventSource.CLOSED){
    connect();
  }
}

function connect(){
  if(eventSource){
    try{eventSource.close()}catch{}
  }

  const url=NTFY+'/sse?since=10m&_='+Date.now();
  eventSource=new EventSource(url);

  eventSource.onopen=()=>{
    setTransportStatus('LIVE SSE connected');
    sendPresence();
  };

  eventSource.onerror=()=>{
    setTransportStatus('SSE reconnecting · fallback sync active');
  };

  eventSource.onmessage=ev=>{
    try{
      const env=JSON.parse(ev.data);
      processEnvelopeObject(env);
    }catch(e){}
  };
}

try{
  const cached=JSON.parse(localStorage.getItem(LAST_STATE_KEY)||'null');
  if(cached){
    const age=Date.now()-(Number(cached.updated)||0);
    if(age>=0 && age<=86400000) applyState(cached,false);
  }
}catch{}

clearStaleAlertOverlay();
loadMasterNotes();
updateDeviceNameUI();
if(!localStorage.getItem(DEVICE_NAME_KEY)){
  setTimeout(()=>openDeviceNameEditor(true),450);
}
sendPresence();
if(presenceInterval) clearInterval(presenceInterval);
presenceInterval=setInterval(sendPresence,15000);

updateAwakeUI();
if(awakeWanted) acquireWakeLock().then(updateAwakeUI);
startSyncWatchdog();
startFallbackSync();
connect();


// bandsync-display-hard-resync
window.addEventListener('online',()=>{
  ensureConnection();
  pollLatestState();
  sendPresence();
});

window.addEventListener('focus',()=>{
  ensureConnection();
  pollLatestState();
});
</script>
