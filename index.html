<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>BandSync Display</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#050403;color:#f7f2ea;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif}
body{min-height:100dvh;overflow:hidden}
.display{height:100dvh;max-width:620px;margin:auto;position:relative;display:flex;flex-direction:column;align-items:center;padding:calc(22px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 25%,rgba(160,104,40,.08),transparent 35%),#050403}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
.from{font-size:9px;letter-spacing:.30em;color:#bda173;font-weight:760}
.live{font-size:9px;letter-spacing:.10em;color:#72cf8b;border:1px solid rgba(93,185,117,.24);border-radius:999px;padding:8px 11px}
.center{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.label{font-size:10px;letter-spacing:.30em;color:#d1aa70;font-weight:760;text-align:center}
.rule{width:92px;height:1px;background:linear-gradient(90deg,transparent,#b98d50,transparent);margin:18px auto 22px}
.current{width:100%;text-align:center;font-size:clamp(34px,7vw,60px);line-height:.98;font-weight:860;letter-spacing:-.035em;color:#f1cf98;text-transform:uppercase;word-break:break-word}
.divider{width:72%;height:34px;position:relative;margin:42px 0 34px}
.divider:before,.divider:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(197,145,78,.65),transparent)}
.divider:before{transform:rotate(2deg)} .divider:after{transform:rotate(-2deg);opacity:.45}
.nextLabel{font-size:9px;letter-spacing:.30em;color:#cba56f;font-weight:760;text-align:center}
.next{margin-top:18px;width:92%;text-align:center;font-size:clamp(24px,5vw,38px);line-height:1.05;font-weight:760;color:#d8c5aa;text-transform:uppercase;word-break:break-word}
.votePanel{width:min(90vw,520px);margin-top:26px;padding:14px 15px 12px;border-radius:18px;border:1px solid rgba(214,162,88,.13);background:rgba(11,9,7,.72);backdrop-filter:blur(14px)}
.votePanel.hidden{display:none}
.voteHeader{font-size:9px;letter-spacing:.18em;color:#b99b70;font-weight:720;margin-bottom:10px}
.voteLine{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.11em;font-weight:760}
.voteNo{color:#d1776d} .voteYes{color:#70ca87}
.voteScale{position:relative;height:9px;border-radius:99px;margin:9px 0 13px;background:linear-gradient(90deg,#8c2e2b,#b95d42,#6d634e,#609966,#2e8550);box-shadow:inset 0 1px 4px rgba(0,0,0,.55)}
.voteKnob{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);background:#f1d19a;border:2px solid #15100b;transition:left .22s ease}
.voteButtons{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.voteBtn{height:42px;border-radius:13px;font-size:11px;font-weight:820;letter-spacing:.05em;background:#100d0a;border:1px solid rgba(255,255,255,.06)}
.voteBtn.no{color:#d98a80;border-color:rgba(192,82,72,.22)} .voteBtn.yes{color:#83d59a;border-color:rgba(85,172,108,.22)}
.voteBtn.selected{box-shadow:inset 0 0 0 1px currentColor,0 0 18px rgba(255,255,255,.035)}
.voteMine{margin-top:8px;text-align:center;font-size:9px;color:#70675e;letter-spacing:.06em}
.bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
.awake{display:flex;align-items:center;gap:12px;border:1px solid rgba(214,162,88,.16);background:#0b0907;border-radius:17px;padding:11px 16px;min-width:280px}
.awakeBox{width:31px;height:31px;border:1px solid rgba(214,162,88,.28);border-radius:10px;display:grid;place-items:center;color:#72cf8b;font-weight:900}
.awakeText b{display:block;font-size:10px;letter-spacing:.14em;color:#d8b77f} .awakeText span{display:block;font-size:9px;color:#73675b;margin-top:4px}
.footer{font-size:8px;letter-spacing:.28em;color:#5b5148}
.alertOverlay{position:fixed;inset:0;background:rgba(3,2,1,.94);display:flex;align-items:center;justify-content:center;padding:80px 26px 40px;opacity:0;pointer-events:none;transition:opacity .16s ease;z-index:1000}
.alertOverlay.show{opacity:1;pointer-events:auto}
.alertInner{text-align:center;max-width:620px}
.alertTag{font-size:10px;letter-spacing:.32em;color:#d5a45d;font-weight:800;margin-bottom:18px}
.alertText{font-size:clamp(34px,8vw,64px);line-height:1.02;font-weight:860;color:#f5d49e;word-break:break-word}
.alertClose{position:absolute;top:calc(18px + env(safe-area-inset-top));right:18px;width:62px;height:62px;border-radius:20px;border:1px solid rgba(242,209,154,.22);background:rgba(18,14,10,.9);color:#f2d19a;font-size:30px;display:grid;place-items:center;z-index:1001}
.version{position:fixed;left:7px;bottom:3px;font-size:7px;color:#443b32;pointer-events:none}
</style>
</head>
<body>
<div class="display">
  <div class="top"><div class="from">UŽIVO OD: MASTER</div><div class="live">● LIVE</div></div>

  <div class="center">
    <div class="label">TRENUTNO</div><div class="rule"></div>
    <div class="current" id="current">ČEKAM MASTER</div>

    <div class="divider"></div>

    <div class="nextLabel">SLEDEĆA PESMA</div>
    <div class="next" id="next">—</div>

    <div class="votePanel hidden" id="votePanel">
      <div class="voteHeader">GLASANJE ZA SLEDEĆU PESMU</div>
      <div class="voteLine"><span class="voteNo">PROTIV <b id="noCount">0</b></span><span class="voteYes">ZA <b id="yesCount">0</b></span></div>
      <div class="voteScale"><i class="voteKnob" id="voteKnob"></i></div>
      <div class="voteButtons"><button class="voteBtn no" id="voteNoBtn">✕ PROTIV</button><button class="voteBtn yes" id="voteYesBtn">✓ ZA</button></div>
      <div class="voteMine" id="voteMine">Nisi glasao</div>
    </div>
  </div>

  <div class="bottom">
    <button class="awake" id="awakeBtn">
      <span class="awakeBox" id="awakeBox"></span>
      <span class="awakeText"><b>KEEP SCREEN AWAKE</b><span id="awakeSub">Tap to enable</span></span>
    </button>
    <div class="footer">BANDSYNC · LIVE DISPLAY</div>
  </div>
</div>

<div class="alertOverlay" id="alertOverlay" aria-live="assertive">
  <button class="alertClose" id="alertClose" aria-label="Close">✕</button>
  <div class="alertInner"><div class="alertTag">MESSAGE FROM MASTER</div><div class="alertText" id="alertText"></div></div>
</div>
<div class="version">STABLE v3.0</div>

<script>
'use strict';

const TOPIC='bandsync-3895bb890a4eb15dcaa9';
const NTFY='https://ntfy.sh/'+TOPIC;
const DEVICE_KEY='bs3_device';
const LAST_STATE_KEY='bs3_last_state';
const LAST_ALERT_KEY='bs3_last_alert';
const AWAKE_KEY='bs3_awake';

const $=id=>document.getElementById(id);

let deviceId=localStorage.getItem(DEVICE_KEY)||'';
if(!deviceId){
  deviceId='d_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
  localStorage.setItem(DEVICE_KEY,deviceId);
}

let lastStateUpdated=0;
let currentVoteId='';
let votes={};
let alertTimer=null;
let wakeLock=null;
let awakeWanted=localStorage.getItem(AWAKE_KEY)==='1';

function applyState(d,persist=true){
  const updated=Number(d.updated)||0;
  if(updated && updated<lastStateUpdated) return;
  if(updated) lastStateUpdated=updated;

  $('current').textContent=d.current||'ČEKAM MASTER';
  $('next').textContent=d.next||'—';

  const incomingVote=d.voteId||'';
  if(incomingVote!==currentVoteId){
    currentVoteId=incomingVote;
    votes={};
  }
  renderVotes();

  if(persist){
    try{ localStorage.setItem(LAST_STATE_KEY,JSON.stringify(d)); }catch{}
  }
}

function voteCounts(){
  let yes=0,no=0;
  Object.values(votes).forEach(v=>{ if(v==='yes') yes++; else if(v==='no') no++; });
  return {yes,no,total:yes+no};
}

function renderVotes(){
  const panel=$('votePanel');
  if(!currentVoteId || $('next').textContent==='—'){
    panel.classList.add('hidden');
    return;
  }

  panel.classList.remove('hidden');
  const c=voteCounts();
  $('yesCount').textContent=c.yes;
  $('noCount').textContent=c.no;
  $('voteKnob').style.left=(c.total?c.yes/c.total*100:50)+'%';

  const mine=votes[deviceId]||'';
  $('voteYesBtn').classList.toggle('selected',mine==='yes');
  $('voteNoBtn').classList.toggle('selected',mine==='no');
  $('voteMine').textContent=mine==='yes'?'Tvoj glas: ZA':mine==='no'?'Tvoj glas: PROTIV':'Nisi glasao';
}

async function sendVote(value){
  if(!currentVoteId || (value!=='yes'&&value!=='no')) return;
  votes[deviceId]=value;
  renderVotes();
  try{
    await fetch(NTFY,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify({type:'vote',voteId:currentVoteId,deviceId,value,updated:Date.now()}),
      cache:'no-store'
    });
  }catch(e){ console.error(e); }
}

$('voteYesBtn').onclick=()=>sendVote('yes');
$('voteNoBtn').onclick=()=>sendVote('no');

function dismissAlert(){
  if(alertTimer) clearTimeout(alertTimer);
  alertTimer=null;
  $('alertOverlay').classList.remove('show');
}

function showFreshAlert(d){
  const now=Date.now();
  const updated=Number(d.updated)||0;
  const age=updated?now-updated:Infinity;
  const id=String(d.id||updated||'');

  if(!id || age<0 || age>15000) return;
  if(localStorage.getItem(LAST_ALERT_KEY)===id) return;

  localStorage.setItem(LAST_ALERT_KEY,id);
  $('alertText').textContent=d.message||'';
  $('alertOverlay').classList.add('show');

  if(alertTimer) clearTimeout(alertTimer);
  alertTimer=setTimeout(dismissAlert,Math.max(1800,Math.min(Number(d.duration)||6000,12000)));
}

$('alertClose').onclick=dismissAlert;

async function acquireWakeLock(){
  if(!('wakeLock' in navigator)){
    $('awakeSub').textContent='Not supported in this browser';
    return false;
  }
  try{
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',()=>{
      wakeLock=null;
      updateAwakeUI();
    });
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}

async function setAwakeWanted(on){
  awakeWanted=!!on;
  localStorage.setItem(AWAKE_KEY,awakeWanted?'1':'0');
  if(awakeWanted){
    await acquireWakeLock();
  }else if(wakeLock){
    try{ await wakeLock.release(); }catch{}
    wakeLock=null;
  }
  updateAwakeUI();
}

function updateAwakeUI(){
  $('awakeBox').textContent=(awakeWanted&&wakeLock)?'✓':'';
  $('awakeSub').textContent=awakeWanted?(wakeLock?'Screen will stay awake':'Tap / return to page to enable'):'Tap to enable';
}

$('awakeBtn').onclick=()=>setAwakeWanted(!awakeWanted);

document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible' && awakeWanted && !wakeLock){
    await acquireWakeLock();
    updateAwakeUI();
  }
});

function connect(){
  const source=new EventSource(NTFY+'/sse?since=30m');
  source.onmessage=ev=>{
    try{
      const env=JSON.parse(ev.data);
      if(env.event!=='message') return;
      const d=JSON.parse(env.message);

      if(d.type==='alert'){
        showFreshAlert(d);
        return;
      }

      if(d.type==='vote'){
        if(d.voteId===currentVoteId && d.deviceId && (d.value==='yes'||d.value==='no')){
          votes[d.deviceId]=d.value;
          renderVotes();
        }
        return;
      }

      if(d.type==='state' || d.current!==undefined || d.next!==undefined){
        applyState(d,true);
      }
    }catch(e){}
  };
}

try{
  const cached=JSON.parse(localStorage.getItem(LAST_STATE_KEY)||'null');
  if(cached) applyState(cached,false);
}catch{}

updateAwakeUI();
if(awakeWanted) acquireWakeLock().then(updateAwakeUI);
connect();
</script>
</body>
</html>
