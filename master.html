<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050403">
<title>BandSync Master</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#050403;color:#f7f2ea;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif}
button,input,textarea{font:inherit}
button{-webkit-user-select:none;user-select:none}
.app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:#050403}
.head{padding:calc(14px + env(safe-area-inset-top)) 15px 11px;border-bottom:1px solid rgba(214,162,88,.10);background:#070604f2}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:850;letter-spacing:.18em;color:#f2d19a}
.sub{font-size:9px;letter-spacing:.25em;color:#9f7c4e;margin-top:4px}
.share,.small,.ctrl{border:1px solid rgba(214,162,88,.16);background:#120f0b;color:#d9b77f;border-radius:12px;font-weight:760}
.share{height:40px;padding:0 13px}
.status{text-align:right;font-size:9px;color:#6bd28b;margin-top:8px;letter-spacing:.08em}
.hero{padding:10px 13px 8px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),#0b0907;border:1px solid rgba(214,162,88,.14);border-radius:18px;padding:13px}
.card+.card{margin-top:8px}
.lab{font-size:9px;letter-spacing:.2em;color:#bda173;font-weight:760}
.now{font-size:21px;font-weight:820;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next{font-size:18px;font-weight:720;margin-top:7px;color:#e2d3bf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vote{margin-top:11px}
.vote.hidden{display:none}
.counts{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.07em}
.no{color:#d1776d} .yes{color:#70ca87}
.scale{height:7px;border-radius:99px;margin-top:7px;background:linear-gradient(90deg,#8c2e2b,#b95d42,#6d634e,#609966,#2e8550);position:relative;box-shadow:inset 0 1px 3px #0008}
.knob{position:absolute;top:50%;left:50%;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);background:#f1d19a;border:2px solid #15100b;transition:left .2s ease}
.section{flex:1;min-height:0;padding:0 13px 7px;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;margin:5px 2px 8px}
.bar b{font-size:11px;letter-spacing:.14em;color:#c9ab79}
.tools{display:flex;gap:6px}
.small{height:35px;padding:0 9px;font-size:10px}
.clearSmall{
  color:#9d8170;
  border-color:rgba(165,95,74,.16);
  background:#0f0c09;
}
.clearSmall:active{
  color:#e0a497;
  border-color:rgba(177,75,62,.35);
}
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid rgba(214,162,88,.12);border-radius:17px;background:#080705;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.row{position:relative;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.045)}
.row:last-child{border-bottom:none}

.song{width:100%;min-height:57px;display:grid;grid-template-columns:34px 1fr 31px;align-items:center;padding:0 11px;border:0;background:#080705;color:#f7f2ea;text-align:left;position:relative;z-index:1;touch-action:pan-y;transform:translateX(0);transition:transform .18s ease}
.song.active{background:linear-gradient(90deg,rgba(178,116,43,.20),rgba(178,116,43,.04));box-shadow:inset 2px 0 #efc67e}
.song.queued{background:linear-gradient(90deg,rgba(138,106,67,.12),rgba(138,106,67,.03))}
.num{font-size:11px;color:#766b5e}
.title{font-size:15px;font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song.played .title{text-decoration-line:line-through;text-decoration-thickness:1px;text-decoration-color:rgba(226,202,163,.65);text-decoration-skip-ink:none;color:#b9aea0}
.song.played.active .title{color:#efe2cf}
.mark{color:#d6a258;text-align:center}
.tag{font-size:7px;color:#d6a258;border:1px solid rgba(214,162,88,.22);border-radius:5px;padding:2px 4px;margin-left:7px;vertical-align:middle}
.empty{padding:35px 16px;text-align:center;color:#7f7569;font-size:13px}
.foot{padding:7px 13px calc(9px + env(safe-area-inset-bottom));border-top:1px solid rgba(214,162,88,.08)}
.controls{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;padding:8px;border:1px solid rgba(214,162,88,.14);border-radius:19px;background:#0d0b08}
.ctrl{height:44px;font-size:11px}
.ctrl.main{background:linear-gradient(#e4bb79,#bd8240);color:#171008}
.voteCtrl{background:linear-gradient(180deg,#3a2415,#20150d);color:#f1c77f;border-color:rgba(184,120,52,.31)}
.voteCtrl.active{background:linear-gradient(180deg,#d69b4e,#a9682b);color:#171008;box-shadow:0 0 16px rgba(214,155,78,.18)}
.ctrl:disabled{opacity:.30}
.modal{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;padding:15px;background:#000c;backdrop-filter:blur(10px);z-index:20}
.modal.open{display:flex}
.sheet{width:min(100%,520px);background:#0e0c09;border:1px solid rgba(214,162,88,.22);border-radius:23px;padding:18px}
.sheet h2{margin:0 0 6px;font-size:20px}
.sheet p{margin:0 0 12px;color:#948777;font-size:12px}
.field,textarea{width:100%;border:1px solid rgba(214,162,88,.16);background:#070604;color:#f7f2ea;border-radius:13px;outline:none;padding:12px}
textarea{height:220px;resize:none} .field{height:48px}
.acts{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;margin-top:10px}
.sec,.imp{border:0;border-radius:11px;padding:12px;font-weight:760}
.sec{background:#18140f;color:#d7c3a4} .imp{background:linear-gradient(#e4bb79,#bd8240);color:#171008}


.deletePopover{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(86vw,340px);
  background:#100d0a;
  border:1px solid rgba(214,162,88,.24);
  border-radius:18px;
  padding:14px;
  z-index:40;
  box-shadow:0 18px 50px rgba(0,0,0,.48);
  display:none;
}
.deletePopover.open{display:block}
.deletePopoverBackdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.18);
  z-index:39;
  display:none;
}
.deletePopoverBackdrop.open{display:block}
.deleteConfirmTitle{font-size:21px;font-weight:840;margin:0 0 7px}
.deleteConfirmSong{font-size:14px;color:#d8c5aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:15px}
.deleteDanger{border:0;border-radius:11px;padding:12px;font-weight:840;background:linear-gradient(180deg,#9b3732,#74231f);color:#ffe4e0}


.playlistTabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  margin:8px 0 12px;
  border-bottom:1px solid rgba(214,162,88,.12);
}
.playlistTab{
  height:38px;
  border:0;
  background:transparent;
  color:#8e7d6d;
  font-size:10px;
  font-weight:780;
  letter-spacing:.08em;
  position:relative;
}
.playlistTab.active{
  color:#e8c98f;
}
.playlistTab.active:after{
  content:"";
  position:absolute;
  left:18%;
  right:18%;
  bottom:-1px;
  height:2px;
  border-radius:99px;
  background:#d6a258;
}
.newPlaylistBtn{
  width:100%;
  height:44px;
  border-radius:13px;
  border:1px solid rgba(214,162,88,.18);
  background:#100d0a;
  color:#e4bf7f;
  font-size:11px;
  font-weight:820;
  letter-spacing:.04em;
  margin-bottom:12px;
}
.savedPlaylistRow{
  grid-template-columns:46px 1fr 42px !important;
  gap:10px !important;
  padding:9px 10px !important;
}
.playlistThumb{
  width:46px;
  height:46px;
  border-radius:10px;
  border:1px solid rgba(214,162,88,.14);
  background:
    radial-gradient(circle at 70% 30%,rgba(214,162,88,.12),transparent 35%),
    linear-gradient(145deg,#17110d,#0d0a08);
  display:grid;
  place-items:center;
  color:#c69b5b;
  font-size:16px;
}
.playlistFav{
  position:absolute;
  right:56px;
  top:50%;
  transform:translateY(-50%);
  width:32px;
  height:32px;
  border:0;
  background:transparent;
  color:#6d6257;
  font-size:18px;
}
.playlistFav.active{
  color:#e3b45f;
}
.savedPlaylistRow{
  position:relative;
}
.managePlaylistsBtn{
  width:100%;
  height:42px;
  border-radius:12px;
  border:1px solid rgba(214,162,88,.18);
  background:#0d0b08;
  color:#caa66f;
  font-size:10px;
  font-weight:780;
  letter-spacing:.05em;
  margin-top:12px;
}
.playlistSaveRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  margin-top:12px;
}
.playlistManagerList{
  margin-top:14px;
  max-height:42vh;
  overflow:auto;
  border:1px solid rgba(214,162,88,.12);
  border-radius:15px;
  background:#090705;
}
.playlistManagerEmpty{
  padding:24px 14px;
  text-align:center;
  color:#786d62;
  font-size:12px;
}
.savedPlaylistRow{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,.045);
}
.savedPlaylistRow:last-child{border-bottom:none}
.savedPlaylistLoad{
  min-width:0;
  text-align:left;
  border:0;
  background:transparent;
  color:#f4ede3;
  padding:3px 2px;
}
.savedPlaylistName{
  display:block;
  font-size:14px;
  font-weight:760;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.savedPlaylistMeta{
  display:block;
  margin-top:3px;
  font-size:9px;
  letter-spacing:.06em;
  color:#776b5e;
}
.savedPlaylistDelete{
  width:38px;
  height:38px;
  border-radius:11px;
  border:1px solid rgba(174,74,63,.20);
  background:#120b09;
  color:#c97b70;
  font-size:17px;
  font-weight:700;
}
.version{position:fixed;left:7px;bottom:3px;font-size:7px;color:#443b32;pointer-events:none}
</style>
</head>
<body>
<div class="app">
<header class="head">
  <div class="top">
    <div><div class="brand">BANDSYNC</div><div class="sub">MASTER</div></div>
    <button class="share" id="shareBtn">QR SHARE</button>
  </div>
  <div class="status" id="status">READY</div>
</header>

<section class="hero">
  <div class="card"><div class="lab">NOW PLAYING</div><div class="now" id="nowTitle">Izaberi prvu pesmu</div></div>
  <div class="card">
    <div class="lab">NEXT SONG</div><div class="next" id="nextTitle">Izaberi sledeću pesmu</div>
    <div class="vote hidden" id="voteBox">
      <div class="counts"><span class="no">PROTIV <b id="voteNo">0</b></span><span class="yes">ZA <b id="voteYes">0</b></span></div>
      <div class="scale"><i class="knob" id="voteKnob"></i></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="bar">
    <b>SETLIST <span id="songCount">(0)</span></b>
    <div class="tools">
      <button class="small clearSmall" id="clearBtn">CLEAR</button>
      <button class="small" id="playlistsBtn">PLAYLISTS</button>
      <button class="small" id="msgBtn">⚠ MSG</button>
      <button class="small" id="quickBtn">⌨ QUICK</button>
      <button class="small" id="addBtn">＋ ADD</button>
    </div>
  </div>
  <div class="list" id="list"></div>
</section>

<footer class="foot">
  <div class="controls">
    <button class="ctrl voteCtrl" id="voteBtn">VOTE</button>
    <button class="ctrl main" id="goNextBtn">GO NEXT ▶</button>
    <button class="ctrl" id="displayBtn">DISPLAY</button>
  </div>
</footer>
</div>

<div class="modal" id="addModal">
  <div class="sheet">
    <h2>Paste song list</h2>
    <p>Svaki novi red postaje jedna pesma.</p>
    <textarea id="pasteInput" placeholder="Pesma 1&#10;Pesma 2&#10;Pesma 3"></textarea>
    <div class="acts"><button class="sec" id="addCancel">Cancel</button><button class="sec" id="replaceBtn">Replace</button><button class="imp" id="appendBtn">Add songs</button></div>
  </div>
</div>

<div class="modal" id="quickModal">
  <div class="sheet">
    <h2>Quick song</h2>
    <input class="field" id="quickInput" placeholder="Naziv pesme…">
    <div class="acts"><button class="sec" id="quickCancel">Cancel</button><button class="sec" id="quickNext">SET NEXT</button><button class="imp" id="quickNow">PLAY NOW</button></div>
  </div>
</div>

<div class="modal" id="msgModal">
  <div class="sheet">
    <h2>Emergency message</h2>
    <input class="field" id="msgInput" placeholder="npr. Preskoči solo…">
    <div class="acts"><button class="sec" id="msgCancel">Cancel</button><button class="imp" id="msgSend">SEND</button></div>
  </div>
</div>

<div class="deletePopoverBackdrop" id="deleteBackdrop"></div>
<div class="deletePopover" id="deleteModal">
  <div class="deleteConfirmTitle">Delete song?</div>
  <div class="deleteConfirmSong" id="deleteSongTitle"></div>
  <div class="acts" style="grid-template-columns:1fr 1.15fr">
    <button class="sec" id="deleteCancel">CANCEL</button>
    <button class="deleteDanger" id="deleteConfirm">DELETE</button>
  </div>
</div>
<div class="modal" id="clearModal">
  <div class="sheet">
    <h2>Clear playlist?</h2>
    <p>Obrisaće se cela setlista i NOW/NEXT stanje.</p>
    <div class="acts" style="grid-template-columns:1fr 1.15fr">
      <button class="sec" id="clearCancel">CANCEL</button>
      <button class="deleteDanger" id="clearConfirm">CLEAR ALL</button>
    </div>
  </div>
</div>
<div class="modal" id="playlistsModal">
  <div class="sheet">
    <h2>Playlists</h2>

    <div class="playlistTabs">
      <button class="playlistTab active" data-tab="all" id="tabAll">ALL</button>
      <button class="playlistTab" data-tab="favorites" id="tabFavorites">FAVORITES</button>
      <button class="playlistTab" data-tab="recent" id="tabRecent">RECENT</button>
    </div>

    <button class="newPlaylistBtn" id="newPlaylistBtn">＋ NEW PLAYLIST</button>

    <div class="playlistSaveRow" id="playlistSaveRow" style="display:none">
      <input class="field" id="playlistNameInput" placeholder="Naziv playliste…">
      <button class="imp" id="savePlaylistBtn">SAVE</button>
    </div>

    <div class="playlistManagerList" id="playlistManagerList"></div>

    <button class="managePlaylistsBtn" id="managePlaylistsBtn">⚙ MANAGE PLAYLISTS</button>

    <div class="acts" style="grid-template-columns:1fr;margin-top:10px">
      <button class="sec" id="playlistsClose">CLOSE</button>
    </div>
  </div>
</div>
<div class="version">STABLE v3.8</div>

<script>
'use strict';

const TOPIC='bandsync-3895bb890a4eb15dcaa9';
const NTFY='https://ntfy.sh/'+TOPIC;
const DISPLAY_URL='https://markoatanackovic1-cell.github.io/bandsync-display2/';

const KEY={
  songs:'bs3_songs',
  current:'bs3_current',
  next:'bs3_next',
  manualCurrent:'bs3_manual_current',
  manualNext:'bs3_manual_next',
  played:'bs3_played',
  playlists:'bs3_saved_playlists'
};

let songs=[];
let currentId=null;
let nextId=null;
let manualCurrent='';
let manualNext='';
let playedIds=[];
let savedPlaylists=[];
let playlistTab='all';
let pendingDeleteId=null;
let suppressRowClickUntil=0;
let voteActive=false;
let voteId='';
let voteMap={};
let voteStream=null;
let lastPublishAt=0;

const $=id=>document.getElementById(id);

function safeParse(value,fallback){
  try{ const v=JSON.parse(value); return v ?? fallback; }catch{ return fallback; }
}

function load(){
  songs=safeParse(localStorage.getItem(KEY.songs),'');
  if(!Array.isArray(songs)) songs=[];
  currentId=localStorage.getItem(KEY.current)||null;
  nextId=localStorage.getItem(KEY.next)||null;
  manualCurrent=localStorage.getItem(KEY.manualCurrent)||'';
  manualNext=localStorage.getItem(KEY.manualNext)||'';
  playedIds=safeParse(localStorage.getItem(KEY.played),'');
  if(!Array.isArray(playedIds)) playedIds=[];
  savedPlaylists=safeParse(localStorage.getItem(KEY.playlists),'');
  if(!Array.isArray(savedPlaylists)) savedPlaylists=[];
  savedPlaylists=savedPlaylists.map(pl=>({
    ...pl,
    favorite:!!pl.favorite
  }));
}

function save(){
  localStorage.setItem(KEY.songs,JSON.stringify(songs));
  currentId?localStorage.setItem(KEY.current,currentId):localStorage.removeItem(KEY.current);
  nextId?localStorage.setItem(KEY.next,nextId):localStorage.removeItem(KEY.next);
  manualCurrent?localStorage.setItem(KEY.manualCurrent,manualCurrent):localStorage.removeItem(KEY.manualCurrent);
  manualNext?localStorage.setItem(KEY.manualNext,manualNext):localStorage.removeItem(KEY.manualNext);
  localStorage.setItem(KEY.played,JSON.stringify(playedIds));
  localStorage.setItem(KEY.playlists,JSON.stringify(savedPlaylists));
}

function current(){
  if(manualCurrent) return {title:manualCurrent,manual:true,id:null};
  return songs.find(s=>s.id===currentId)||null;
}

function queued(){
  if(manualNext) return {title:manualNext,manual:true,id:null};
  return songs.find(s=>s.id===nextId)||null;
}

function markPlayed(id){
  if(id && !playedIds.includes(id)) playedIds.push(id);
}

function newVoteId(){
  return 'vote_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
}

function resetVote(){
  voteActive=false;
  voteId='';
  voteMap={};
}

function statePayload(){
  const c=current(), n=queued();
  return {
    type:'state',
    current:c?c.title:'',
    next:n?n.title:'',
    voteId:(voteActive&&n)?voteId:'',
    updated:Date.now()
  };
}

function setStatus(t){
  $('status').textContent=t;
}

async function publish(payload=statePayload()){
  const stamp=Date.now();
  lastPublishAt=stamp;
  setStatus('SENDING…');
  try{
    const r=await fetch(NTFY,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify(payload),
      cache:'no-store'
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(lastPublishAt===stamp){
      setStatus('SENT ✓');
      setTimeout(()=>{ if(lastPublishAt===stamp) setStatus('READY'); },900);
    }
  }catch(e){
    console.error(e);
    setStatus('SEND ERROR');
  }
}

function escapeHtml(t){
  return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function parseSongLines(){
  return $('pasteInput').value
    .replace(/\r/g,'\n')
    .split(/\n+/)
    .map(x=>x.trim().replace(/^\s*\d+\s*[.):-]\s*/,''))
    .filter(Boolean);
}

function openDeleteConfirm(song,sourceEl){
  pendingDeleteId=song.id;
  $('deleteSongTitle').textContent=song.title;

  const pop=$('deleteModal');
  const backdrop=$('deleteBackdrop');

  let top=window.innerHeight/2;
  if(sourceEl){
    const r=sourceEl.getBoundingClientRect();
    top=r.top + r.height/2;
  }

  // Keep it comfortably inside the viewport.
  const minTop=120;
  const maxTop=window.innerHeight-150;
  top=Math.max(minTop,Math.min(maxTop,top));

  pop.style.top=top+'px';
  pop.classList.add('open');
  backdrop.classList.add('open');
}

function closeDeleteConfirm(){
  pendingDeleteId=null;
  $('deleteModal').classList.remove('open');
  $('deleteBackdrop').classList.remove('open');
}


function playlistId(){
  return 'pl_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
}

function renderPlaylistManager(){
  const box=$('playlistManagerList');
  box.innerHTML='';

  document.querySelectorAll('.playlistTab').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.tab===playlistTab);
  });

  let items=[...savedPlaylists];

  if(playlistTab==='favorites'){
    items=items.filter(pl=>pl.favorite);
  }else if(playlistTab==='recent'){
    items=items
      .sort((a,b)=>(b.updated||0)-(a.updated||0))
      .slice(0,8);
  }else{
    items=items.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  }

  if(!items.length){
    box.innerHTML='<div class="playlistManagerEmpty">'+
      (playlistTab==='favorites'?'Nema omiljenih playlista.':
       playlistTab==='recent'?'Nema nedavno korišćenih playlista.':
       'Nema sačuvanih playlista.')+
      '</div>';
    return;
  }

  items.forEach((pl,index)=>{
    const row=document.createElement('div');
    row.className='savedPlaylistRow';

    const thumb=document.createElement('div');
    thumb.className='playlistThumb';
    const icons=['♫','◐','✦','●','▣','◇','✶','☾'];
    thumb.textContent=icons[index%icons.length];

    const loadBtn=document.createElement('button');
    loadBtn.className='savedPlaylistLoad';
    loadBtn.type='button';

    const count=Array.isArray(pl.songs)?pl.songs.length:0;
    loadBtn.innerHTML=
      '<span class="savedPlaylistName">'+escapeHtml(pl.name||'Untitled')+'</span>'+
      '<span class="savedPlaylistMeta">'+count+' songs</span>';

    loadBtn.onclick=()=>{
      const arr=Array.isArray(pl.songs)?pl.songs:[];
      songs=arr.map((title,i)=>({
        id:'s_'+Date.now().toString(36)+'_'+i.toString(36)+'_'+Math.random().toString(36).slice(2,6),
        title:String(title)
      }));

      pl.updated=Date.now();

      currentId=null;
      nextId=null;
      manualCurrent='';
      manualNext='';
      playedIds=[];
      pendingDeleteId=null;
      resetVote();

      save();
      $('playlistsModal').classList.remove('open');
      render();
      publish();
    };

    const favBtn=document.createElement('button');
    favBtn.className='playlistFav'+(pl.favorite?' active':'');
    favBtn.type='button';
    favBtn.textContent=pl.favorite?'★':'☆';
    favBtn.title='Favorite';
    favBtn.onclick=ev=>{
      ev.preventDefault();
      ev.stopPropagation();
      pl.favorite=!pl.favorite;
      pl.updated=Date.now();
      save();
      renderPlaylistManager();
    };

    const delBtn=document.createElement('button');
    delBtn.className='savedPlaylistDelete';
    delBtn.type='button';
    delBtn.textContent='×';
    delBtn.title='Delete playlist';
    delBtn.onclick=ev=>{
      ev.preventDefault();
      ev.stopPropagation();

      if(!confirm('Delete playlist "'+(pl.name||'Untitled')+'"?')) return;

      savedPlaylists=savedPlaylists.filter(x=>x.id!==pl.id);
      save();
      renderPlaylistManager();
    };

    row.append(thumb,loadBtn,favBtn,delBtn);
    box.appendChild(row);
  });
}

function saveCurrentPlaylist(){
  const name=$('playlistNameInput').value.trim();
  if(!name || !songs.length) return;

  const existing=savedPlaylists.find(x=>String(x.name).toLocaleLowerCase()===name.toLocaleLowerCase());

  if(existing){
    existing.songs=songs.map(s=>s.title);
    existing.updated=Date.now();
  }else{
    savedPlaylists.push({
      id:playlistId(),
      name,
      songs:songs.map(s=>s.title),
      favorite:false,
      updated:Date.now()
    });
  }

  save();
  $('playlistNameInput').value='';
  renderPlaylistManager();
}

function renderVotes(){
  const q=queued();
  const box=$('voteBox');
  $('voteBtn').disabled=!q;
  $('voteBtn').classList.toggle('active',voteActive&&!!q);

  if(!q || !voteActive || !voteId){
    box.classList.add('hidden');
    return;
  }

  box.classList.remove('hidden');
  let yes=0,no=0;
  Object.values(voteMap).forEach(v=>{ if(v==='yes') yes++; else if(v==='no') no++; });
  $('voteYes').textContent=yes;
  $('voteNo').textContent=no;
  const total=yes+no;
  $('voteKnob').style.left=(total?yes/total*100:50)+'%';
}

function render(){
  const c=current();
  const q=queued();

  $('nowTitle').textContent=c?c.title:'Izaberi prvu pesmu';
  $('nextTitle').textContent=q?q.title:'Izaberi sledeću pesmu';
  $('songCount').textContent='('+songs.length+')';
  $('goNextBtn').disabled=!q;

  const list=$('list');
  list.innerHTML='';

  if(!songs.length){
    list.innerHTML='<div class="empty">Klikni ADD i nalepi listu pesama.</div>';
  }

  songs.forEach((song,index)=>{
    const isCurrent=!manualCurrent && currentId===song.id;
    const isNext=!manualNext && nextId===song.id;
    const isPlayed=playedIds.includes(song.id);

    const row=document.createElement('div');
    row.className='row';
    row.dataset.id=song.id;

    const btn=document.createElement('button');
    btn.className='song'+(isCurrent?' active':'')+(isNext?' queued':'')+(isPlayed?' played':'');
    btn.type='button';
    btn.innerHTML=
      '<div class="num">'+String(index+1).padStart(2,'0')+'</div>'+
      '<div class="title">'+escapeHtml(song.title)+(isNext?'<span class="tag">NEXT</span>':'')+'</div>'+
      '<div class="mark">'+(isCurrent?'▶':isNext?'→':'')+'</div>';

    let pointerId=null;
    let startX=0,startY=0,lastX=0,lastY=0;
    let axis='';
    let dragged=false;
    let deleteGesture=false;

    btn.addEventListener('pointerdown',ev=>{
      if(ev.pointerType==='mouse' && ev.button!==0) return;

      pointerId=ev.pointerId;
      startX=lastX=ev.clientX;
      startY=lastY=ev.clientY;
      axis='';
      dragged=false;
      deleteGesture=false;

      try{btn.setPointerCapture(pointerId)}catch{}
      btn.style.transition='none';
    });

    btn.addEventListener('pointermove',ev=>{
      if(pointerId!==ev.pointerId) return;

      lastX=ev.clientX;
      lastY=ev.clientY;

      const dx=lastX-startX;
      const dy=lastY-startY;

      if(!axis && (Math.abs(dx)>10 || Math.abs(dy)>10)){
        axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
      }

      if(axis!=='x'){
        btn.style.transform='';
        return;
      }

      dragged=true;

      // Temporary movement only — never persists after finger release.
      const tx=Math.max(-58,Math.min(0,dx));
      btn.style.transform='translateX('+tx+'px)';
      deleteGesture=dx<-52;
    });

    function resetGesture(){
      pointerId=null;
      axis='';
      dragged=false;
      deleteGesture=false;
      btn.style.transition='transform .14s ease';
      btn.style.transform='translateX(0)';
      setTimeout(()=>{btn.style.transform='';},160);
    }

    btn.addEventListener('pointerup',ev=>{
      if(pointerId!==ev.pointerId) return;

      const shouldDelete=axis==='x' && dragged && deleteGesture;

      try{btn.releasePointerCapture(pointerId)}catch{}
      resetGesture();

      if(shouldDelete){
        suppressRowClickUntil=Date.now()+500;
        setTimeout(()=>openDeleteConfirm(song,btn),40);
      }
    });

    btn.addEventListener('pointercancel',ev=>{
      if(pointerId!==ev.pointerId) return;
      resetGesture();
    });

    btn.addEventListener('click',ev=>{
      if(Date.now()<suppressRowClickUntil || dragged || deleteGesture){
        ev.preventDefault();
        return;
      }

      if(!current()){
        currentId=song.id;
        manualCurrent='';
        nextId=null;
        manualNext='';
        markPlayed(song.id);
        resetVote();
      }else if(!isCurrent){
        if(isNext){
          nextId=null;
          manualNext='';
          resetVote();
        }else{
          nextId=song.id;
          manualNext='';
          resetVote();
        }
      }

      save();
      render();
      publish();
    });

    row.append(btn);
    list.appendChild(row);
  });

  renderVotes();
}

function goNext(){
  const q=queued();
  if(!q) return;

  if(q.manual){
    manualCurrent=q.title;
    currentId=null;
  }else{
    currentId=q.id;
    manualCurrent='';
    markPlayed(q.id);
  }

  nextId=null;
  manualNext='';
  resetVote();
  
  save();
  render();
  publish();
}

function connectVoteStream(){
  if(voteStream) try{voteStream.close();}catch{}
  try{
    voteStream=new EventSource(NTFY+'/sse?since=30m');
    voteStream.onmessage=ev=>{
      try{
        const env=JSON.parse(ev.data);
        if(env.event!=='message') return;
        const d=JSON.parse(env.message);
        if(!voteActive || d.type!=='vote' || d.voteId!==voteId || !d.deviceId) return;
        if(d.value!=='yes' && d.value!=='no') return;
        voteMap[d.deviceId]=d.value;
        renderVotes();
      }catch{}
    };
  }catch(e){ console.error(e); }
}

  playlistTab='all';
  $('playlistNameInput').value='';
  $('playlistSaveRow').style.display='none';

  $('playlistsModal').classList.add('open');
};

};

  }

});

  playlistTab='all';

};

$('addBtn').onclick=()=>{   $('pasteInput').value=''; $('addModal').classList.add('open'); };
$('addCancel').onclick=()=>$('addModal').classList.remove('open');

$('appendBtn').onclick=()=>{
  const arr=parseSongLines();
  if(!arr.length) return;
  const seen=new Set(songs.map(s=>s.title.toLocaleLowerCase()));
  arr.forEach(title=>{
    const k=title.toLocaleLowerCase();
    if(!seen.has(k)){
      songs.push({id:'s_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8),title});
      seen.add(k);
    }
  });
  save();
  $('addModal').classList.remove('open');
  render();
};

$('replaceBtn').onclick=()=>{
  const arr=parseSongLines();
  if(!arr.length) return;
  songs=arr.map((title,i)=>({id:'s_'+Date.now().toString(36)+'_'+i.toString(36)+'_'+Math.random().toString(36).slice(2,6),title}));
  currentId=null; nextId=null; manualCurrent=''; manualNext=''; playedIds=[];  resetVote();
  save();
  $('addModal').classList.remove('open');
  render();
  publish();
};

$('quickBtn').onclick=()=>{   $('quickInput').value=''; $('quickModal').classList.add('open'); };
$('quickCancel').onclick=()=>$('quickModal').classList.remove('open');

$('quickNext').onclick=()=>{
  const title=$('quickInput').value.trim();
  if(!title) return;
  manualNext=title;
  nextId=null;
  resetVote();
  save();
  $('quickModal').classList.remove('open');
  render();
  publish();
};

$('quickNow').onclick=()=>{
  const title=$('quickInput').value.trim();
  if(!title) return;

  currentId=null;
  manualNext='';
  nextId=null;
  resetVote();
  save();

$('msgBtn').onclick=()=>{   $('msgInput').value=''; $('msgModal').classList.add('open'); };
$('msgCancel').onclick=()=>$('msgModal').classList.remove('open');

$('msgSend').onclick=()=>{
  const message=$('msgInput').value.trim();
  if(!message) return;
  $('msgModal').classList.remove('open');
  publish({
    type:'alert',
    id:'alert_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),
    message,
    duration:6000,
    updated:Date.now()
  });
};



$('clearCancel').onclick=()=>$('clearModal').classList.remove('open');

$('clearConfirm').onclick=()=>{
  songs=[];
  currentId=null;
  nextId=null;
  manualCurrent='';
  manualNext='';
  playedIds=[];
  pendingDeleteId=null;
  resetVote();

  save();
  $('clearModal').classList.remove('open');
  render();
  publish();
};

$('deleteCancel').onclick=closeDeleteConfirm;
$('deleteBackdrop').onclick=closeDeleteConfirm;

$('deleteConfirm').onclick=()=>{
  if(!pendingDeleteId) return;

  const song=songs.find(s=>s.id===pendingDeleteId);
  if(!song){
    closeDeleteConfirm();
    return;
  }

  const wasCurrent=!manualCurrent && currentId===song.id;
  const wasNext=!manualNext && nextId===song.id;

  songs=songs.filter(s=>s.id!==song.id);
  playedIds=playedIds.filter(id=>id!==song.id);

  if(wasCurrent){
    currentId=null;
    manualCurrent='';
  }

  if(wasNext){
    nextId=null;
    manualNext='';
    resetVote();
  }

  closeDeleteConfirm();
  suppressRowClickUntil=Date.now()+350;
  save();
  render();
  publish();
};

$('voteBtn').onclick=()=>{
  const q=queued();
  if(!q) return;

  voteActive=!voteActive;
  if(voteActive){
    voteId=newVoteId();
    voteMap={};
  }else{
    voteId='';
    voteMap={};
  }
  render();
  publish();
};

$('goNextBtn').onclick=goNext;
$('displayBtn').onclick=()=>window.open(DISPLAY_URL,'_blank');
$('shareBtn').onclick=()=>window.open('https://api.qrserver.com/v1/create-qr-code/?size=420x420&data='+encodeURIComponent(DISPLAY_URL),'_blank');

['addModal','quickModal','msgModal','clearModal','playlistsModal'].forEach(id=>{
  $(id).addEventListener('click',ev=>{ if(ev.target===$(id)) $(id).classList.remove('open'); });
});

load();
connectVoteStream();
render();
publish();
</script>
